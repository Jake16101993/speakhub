<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakHub CS</title><style>
:root{--g:#0b7a5b;--gd:#075c45;--line:#dce7e2;--muted:#68766f;--bg:#f4f8f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#17211d}.hidden{display:none!important}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.muted{color:var(--muted)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #173c2c0a}.login{max-width:520px;margin:70px auto}.login-row{display:grid;grid-template-columns:1fr auto;gap:8px}.layout{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-size:25px;font-weight:950;color:var(--gd)}.side-sub{font-size:12px;margin-top:5px;color:var(--muted)}.nav{display:grid;gap:7px;margin-top:26px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:11px;font-weight:850;color:#46524d;cursor:pointer}.nav button.on{background:#e8f5f0;color:var(--gd)}.side-bottom{position:absolute;left:16px;right:16px;bottom:18px}.content{padding:24px;min-width:0}.content-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.page-title{font-size:25px;font-weight:900}.session{display:grid;grid-template-columns:125px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.session:last-child{border-bottom:0}.session b,.session small{display:block}.session small{color:var(--muted);margin-top:3px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;border:1px solid var(--line);border-radius:9px;padding:6px}.day.has{background:#eef9f5}.day span{display:block;font-size:10px;margin-top:4px}.support-chat-grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:12px}.support-chat-threads{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:600px}.support-chat-thread{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.support-chat-thread:hover{background:#f5faf8}.support-chat-thread.on{background:#e7f5ef}.support-chat-thread b{display:block}.support-chat-thread small{color:var(--muted)}.support-chat-panel{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.support-chat-messages{height:470px;overflow:auto;background:#fbfdfc;border-radius:10px;padding:10px}.support-chat-msg{max-width:78%;padding:9px 11px;border-radius:11px;background:#eef2f0;margin:7px 0}.support-chat-msg.admin{margin-left:auto;background:#dff4eb}.support-chat-input{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px}.assist-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:16px}.assist-sessions{display:grid;gap:8px;max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px}.assist-session{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}.assist-session input{width:auto;margin-top:3px}.assist-session b,.assist-session small{display:block}.assist-session small{color:var(--muted);margin-top:3px}.assist-pay{text-align:center;background:#fbfdfc}.assist-pay img{width:260px;max-width:90%;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fff}.mobile-top{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}.side-bottom{position:static;margin-top:10px}.content{padding:14px}.support-chat-grid,.assist-grid{grid-template-columns:1fr}.session{grid-template-columns:1fr}.support-chat-messages{height:350px}.grid{gap:3px}.day{min-height:48px;font-size:10px}.day span{font-size:0}.day span:before{content:'•';font-size:14px}}
</style></head><body>
<div id="login" class="card login"><div class="brand">SpeakHub CS</div><p class="muted">Customer Support Portal</p><div class="login-row"><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="btn primary" onclick="login()">Đăng nhập</button></div><div id="lm"></div></div>
<div id="app" class="layout hidden">
  <aside class="side"><div class="brand">SpeakHub CS</div><div class="side-sub">Hỗ trợ vận hành & học viên</div><div class="nav">
    <button class="on" data-tab="docs" onclick="tab('docs',this)">▤ Tài liệu sắp tới</button>
    <button data-tab="assist" onclick="tab('assist',this)">＋ Hỗ trợ đăng ký</button>
    <button data-tab="schedule" onclick="tab('schedule',this)">▣ Tra lịch học</button>
    <button data-tab="chat" onclick="tab('chat',this)">◌ Chat SpeakHub</button>
  </div><div class="side-bottom"><button class="btn" style="width:100%" onclick="logout()">Đăng xuất</button></div></aside>
  <main class="content">
    <div class="content-head"><div><div id="pageTitle" class="page-title">Tài liệu sắp tới</div><div id="pageSub" class="muted">Tự động tải các tài liệu cần in của session sắp diễn ra.</div></div></div>
    <section id="docs"><div class="card"><div id="sessions"><p class="muted">Đang tải tài liệu...</p></div></div></section>
    <section id="assist" class="hidden"><div class="card"><div class="assist-grid"><div><label>Số điện thoại</label><input id="assistPhone" inputmode="numeric" maxlength="10" placeholder="0xxxxxxxxx" oninput="assistPhoneChanged()"><label style="display:block;margin-top:10px">Họ tên</label><input id="assistName" placeholder="Tên học viên"><label style="display:block;margin-top:12px">Lọc theo lớp</label><select id="assistClassFilter" onchange="renderCsAssistSessions()" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:15px;margin-bottom:10px"><option value="">Tất cả lớp</option></select><label>Chọn buổi</label><div id="assistSessions" class="assist-sessions"><div class="muted">Đang tải session...</div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="createAssistPayment()">Tạo mã QR thanh toán</button><div id="assistMsg"></div></div><div id="assistPayment" class="card assist-pay" style="margin:0"><div class="muted">QR thanh toán sẽ hiển thị tại đây.</div></div></div></div></section>
    <section id="schedule" class="hidden"><div class="card"><div class="row"><input id="q" placeholder="Số điện thoại hoặc tên" onkeydown="if(event.key==='Enter')search()"><button class="btn primary" onclick="search()">Tra cứu</button></div><div id="results" style="margin-top:12px"></div></div><div id="cal" style="margin-top:14px"></div></section>
    <section id="chat" class="hidden"><div class="card"><div class="support-chat-grid"><div id="supportChatThreads" class="support-chat-threads">Đang tải...</div><div class="support-chat-panel"><h3 id="supportChatTitle" style="margin-top:0">Chọn một cuộc trò chuyện</h3><div id="supportChatMessages" class="support-chat-messages"></div><div class="support-chat-input"><input id="supportChatText" placeholder="Nhập phản hồi..." onkeydown="if(event.key==='Enter')sendSupportChat()"><button class="btn primary" onclick="sendSupportChat()">Gửi</button></div></div></div></div></section>
  </main>
</div>
<script>
if(location.pathname==='/cs.html')history.replaceState(null,'','/cs'+location.search+location.hash);
let token=sessionStorage.getItem('supporter_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(url,{...opt,cache:'no-store'}),d=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('UNAUTHORIZED')}if(!r.ok)throw Error(d.error||d.details||'Request failed');return d}
async function login(){try{const r=await fetch('/api/admin?action=supporter-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem('supporter_token',token);boot()}catch(e){lm.innerHTML='<p style="color:#b33">'+esc(e.message)+'</p>'}}
function logout(){sessionStorage.removeItem('supporter_token');location.reload()}
function boot(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');tab('docs',document.querySelector('.nav button[data-tab="docs"]'));loadSupportChatThreads()}
const pageMeta={docs:['Tài liệu sắp tới','Tự động tải các tài liệu cần in của session sắp diễn ra.'],assist:['Hỗ trợ đăng ký','Tạo QR thanh toán cho học viên và tự động xác nhận lịch sau khi thanh toán.'],schedule:['Tra lịch học','Tra cứu lịch học sắp tới của học viên.'],chat:['Chat SpeakHub','Quản lý và phản hồi tin nhắn học viên gửi tới SpeakHub.']};
function tab(id,b){document.querySelectorAll('main.content>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b?.classList.add('on');document.getElementById('pageTitle').textContent=pageMeta[id][0];document.getElementById('pageSub').textContent=pageMeta[id][1];if(id==='docs')loadDocs();if(id==='chat')loadSupportChatThreads();if(id==='assist')loadAssistRegistration()}
async function loadDocs(){const host=document.getElementById('sessions');host.innerHTML='<p class="muted">Đang tải tài liệu...</p>';try{const d=await api('/api/admin?action=supporter-sessions'),rows=d.sessions||[];host.innerHTML=rows.map(x=>`<div class="session"><div><b>${esc(x.session_date)}</b><small>${esc((x.starts_at||'').slice(0,5))}–${esc((x.ends_at||'').slice(0,5))}</small></div><div><b>${esc(x.program_name||'Session')}</b><small>${esc(x.topic_title||'Tài liệu buổi học')} · ${esc(x.teacher_name||'Chưa có GV')} · ${esc(x.room_name||'')}</small></div><div><a class="btn primary" href="${esc(x.download_url)}" target="_blank" rel="noopener">Mở / tải PDF</a></div></div>`).join('')||'<p class="muted">Chưa có tài liệu PDF nào cho các session sắp tới.</p>'}catch(e){host.innerHTML='<p style="color:#b33">'+esc(e.message)+'</p>'}}
async function search(){try{const d=await api('/api/admin?action=supporter-student-schedule&q='+encodeURIComponent(q.value));results.innerHTML=(d.customers||[]).map(c=>`<button class="btn" onclick="calendar('${c.id}')">${esc(c.full_name)} · ${esc(c.phone)}</button>`).join('')||'<p class="muted">Không tìm thấy.</p>';if(d.customers?.length===1)calendar(d.customers[0].id)}catch(e){results.innerHTML=esc(e.message)}}
async function calendar(id){const d=await api('/api/admin?action=supporter-student-schedule&customer_id='+encodeURIComponent(id)),rows=d.bookings||[],groups={};rows.forEach(x=>(groups[x.session_date.slice(0,7)]??=[]).push(x));cal.innerHTML=Object.entries(groups).sort().map(([m,a])=>{const[y,mo]=m.split('-').map(Number),off=(new Date(y,mo-1,1).getDay()+6)%7,n=new Date(y,mo,0).getDate(),map={};a.forEach(x=>(map[+x.session_date.slice(-2)]??=[]).push(x));let cells='<div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>'+('<div></div>'.repeat(off));for(let i=1;i<=n;i++)cells+=`<div class="day ${(map[i]||[]).length?'has':''}"><b>${i}</b>${(map[i]||[]).map(x=>`<span>${esc(x.starts_at.slice(0,5))} ${esc(x.program_name)}</span>`).join('')}</div>`;return `<div class="card"><h3>${m}</h3><div class="grid">${cells}</div></div>`}).join('')||'<div class="card muted">Chưa có lịch học.</div>'}
let supportChatCurrentThread=null;
async function loadSupportChatThreads(){try{const d=await api('/api/admin?action=supporter-chat'),host=document.getElementById('supportChatThreads');host.innerHTML=(d.threads||[]).map(t=>`<div class="support-chat-thread ${String(t.thread_key)===String(supportChatCurrentThread)?'on':''}" onclick='openSupportChat(${JSON.stringify(t.thread_key)},${JSON.stringify(t.full_name||"Guest")},${JSON.stringify(t.phone||"")})'><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(t.full_name||'Guest')}</b>${Number(t.unread||0)>0?`<span class="btn" style="padding:2px 7px;font-size:11px">${Number(t.unread||0)}</span>`:''}</div><small>${esc(t.phone||'Khách chưa đăng nhập')}</small><div class="muted" style="font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.last_message||'')}</div></div>`).join('')||'<div class="muted" style="padding:14px">Chưa có cuộc trò chuyện.</div>'}catch(e){const host=document.getElementById('supportChatThreads');if(host)host.innerHTML='<div style="padding:14px;color:#b33">'+esc(e.message)+'</div>'}}
async function openSupportChat(threadKey,name,phone){supportChatCurrentThread=threadKey;supportChatTitle.textContent=`${name||'Guest'}${phone?' · '+phone:''}`;const d=await api('/api/admin?action=supporter-chat&thread_key='+encodeURIComponent(threadKey)),host=document.getElementById('supportChatMessages');host.innerHTML=(d.messages||[]).map(m=>`<div class="support-chat-msg ${m.sender==='ADMIN'?'admin':''}">${esc(m.body||'')}</div>`).join('')||'<div class="muted">Chưa có tin nhắn.</div>';host.scrollTop=host.scrollHeight;await loadSupportChatThreads()}
let supportChatSending=false;async function sendSupportChat(){if(!supportChatCurrentThread||supportChatSending)return;const input=supportChatText,text=(input.value||'').trim();if(!text)return;supportChatSending=true;input.disabled=true;try{await api('/api/admin?action=supporter-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({thread_key:supportChatCurrentThread,text,client_message_id:(crypto.randomUUID?.()||`support-${Date.now()}-${Math.random().toString(36).slice(2)}`)})});input.value='';const parts=supportChatTitle.textContent.split(' · ');await openSupportChat(supportChatCurrentThread,parts[0]||'Guest',parts[1]||'')}catch(e){alert(e.message)}finally{supportChatSending=false;input.disabled=false;input.focus()}}
let assistSessionsCache=[],assistLookupTimer=null,assistPollTimer=null,assistHeartbeatTimer=null,assistActiveOrder=null;
function renderCsAssistSessions(){const box=document.getElementById('assistSessions');if(!box)return;const filter=document.getElementById('assistClassFilter')?.value||'';const rows=assistSessionsCache.filter(x=>{const cap=Number(x.capacity||0),booked=Number(x.booked_count||0);return cap>0&&booked<cap&&(!filter||String(x.program_name||'')===filter)});box.innerHTML=rows.map(x=>`<label class="assist-session"><input type="checkbox" value="${x.id}"><span><b>${esc(x.program_name||'Class')}</b><small>${esc(x.session_date)} · ${String(x.starts_at||'').slice(0,5)}–${String(x.ends_at||'').slice(0,5)} · ${Number(x.booked_count||0)}/${Number(x.capacity||0)}${x.room_name?' · '+esc(x.room_name):''}</small></span></label>`).join('')||'<div class="muted">Không có session còn chỗ phù hợp.</div>'}
async function loadAssistRegistration(){const box=document.getElementById('assistSessions');box.innerHTML='<div class="muted">Đang tải session...</div>';try{const d=await api('/api/admin?action=supporter-registration-sessions');assistSessionsCache=(d.sessions||[]).filter(x=>Number(x.capacity||0)>0&&Number(x.booked_count||0)<Number(x.capacity||0));const filter=document.getElementById('assistClassFilter'),current=filter?.value||'',classes=[...new Set(assistSessionsCache.map(x=>String(x.program_name||'Class')))].sort((a,b)=>a.localeCompare(b,'vi'));if(filter){filter.innerHTML='<option value="">Tất cả lớp</option>'+classes.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');if(classes.includes(current))filter.value=current;}renderCsAssistSessions()}catch(e){box.innerHTML='<div style="color:#b33">'+esc(e.message)+'</div>'}}
function assistPhoneChanged(){assistPhone.value=assistPhone.value.replace(/\D/g,'').slice(0,10);clearTimeout(assistLookupTimer);if(assistPhone.value.length<10)return;assistLookupTimer=setTimeout(async()=>{try{const d=await api('/api/admin?action=supporter-student-schedule&q='+encodeURIComponent(assistPhone.value)),exact=(d.customers||[]).find(c=>String(c.phone)===assistPhone.value);if(exact)assistName.value=exact.full_name||''}catch(_){}},250)}
function clearAssistTimers(){clearInterval(assistPollTimer);clearInterval(assistHeartbeatTimer);assistPollTimer=assistHeartbeatTimer=null}
async function createAssistPayment(){const phone=assistPhone.value.trim(),name=assistName.value.trim(),session_ids=[...document.querySelectorAll('#assistSessions input:checked')].map(x=>x.value);assistMsg.innerHTML='';clearAssistTimers();if(!/^0\d{9}$/.test(phone)){assistMsg.innerHTML='<p style="color:#b33">SĐT phải gồm 10 số và bắt đầu bằng 0.</p>';return}if(name.split(/\s+/).filter(Boolean).length<2){assistMsg.innerHTML='<p style="color:#b33">Vui lòng nhập đầy đủ họ tên.</p>';return}if(!session_ids.length){assistMsg.innerHTML='<p style="color:#b33">Vui lòng chọn ít nhất 1 buổi.</p>';return}assistPayment.innerHTML='<div class="muted">Đang tạo QR PayOS...</div>';try{const br=await fetch('/api/bookings/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,full_name:name,session_ids})}),bd=await br.json();if(!br.ok)throw Error(bd.details||bd.error||'BOOKING_FAILED');const order=bd.order,pr=await fetch('/api/payos/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:order.order_id,checkout_token:order.checkout_token})}),pd=await pr.json();if(!pr.ok)throw Error(pd.details||pd.error||'PAYOS_CREATE_FAILED');assistActiveOrder={...order,payment:pd.payment};assistPayment.innerHTML=`<h3 style="margin-top:0">Quét QR để thanh toán</h3>${pd.payment?.qr_image?`<img src="${pd.payment.qr_image}" alt="QR PayOS">`:''}<div style="font-size:26px;font-weight:900;color:var(--gd);margin-top:8px">${new Intl.NumberFormat('vi-VN').format(Number(pd.payment?.amount||order.total_amount||0))}đ</div><div class="muted" style="margin-top:8px">Đang chờ thanh toán...</div>`;startAssistPolling()}catch(e){assistPayment.innerHTML='<div style="color:#b33">Không tạo được QR.</div>';assistMsg.innerHTML='<p style="color:#b33">'+esc(e.message)+'</p>'}}
function startAssistPolling(){clearAssistTimers();const o=assistActiveOrder;if(!o)return;const check=async()=>{try{const r=await fetch('/api/orders/status?order_id='+encodeURIComponent(o.order_id)+'&token='+encodeURIComponent(o.checkout_token),{cache:'no-store'}),d=await r.json();if(d.order?.payment_status==='PAID'&&d.order?.order_status==='CONFIRMED'){clearAssistTimers();assistPayment.innerHTML='<div style="color:var(--gd)"><h3>Thanh toán thành công</h3><p>Lịch học đã được thêm tự động.</p></div>';loadAssistRegistration();return}await fetch('/api/payos/reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.order_id,checkout_token:o.checkout_token})}).catch(()=>{})}catch(_){}};assistPollTimer=setInterval(check,5000);assistHeartbeatTimer=setInterval(()=>fetch('/api/payos/reconcile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:o.order_id,checkout_token:o.checkout_token,mode:'heartbeat'})}).catch(()=>{}),20000);check()}
setInterval(()=>{if(token&&document.visibilityState==='visible'&&!document.getElementById('chat').classList.contains('hidden'))loadSupportChatThreads()},15000);if(token)boot();
</script></body></html>
