<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakHub Publisher</title><style>
:root{--g:#0b7a5d;--gd:#075d48;--line:#d9e5e0;--muted:#68766f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f3f7f5;color:#14201c}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:30px;font-weight:900;color:var(--gd)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #083b2d0c}.login{max-width:520px;margin:10vh auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.muted{color:var(--muted)}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.kpi{background:#eef8f4;border:1px solid #d5eee4;border-radius:14px;padding:14px}.kpi b{display:block;font-size:24px;color:var(--gd);margin-top:4px}.link{font-family:ui-monospace,monospace;background:#eff7f4;border-radius:10px;padding:9px;word-break:break-all}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}th{color:var(--muted)}.stage{font-weight:900;color:var(--gd)}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tools input{width:auto;min-width:170px}.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;flex-wrap:wrap}.pager button{min-width:38px;padding:8px 10px;background:#fff;border:1px solid var(--line);color:#26352f}.pager button.on{background:var(--g);color:#fff;border-color:var(--g)}.pager button:disabled{opacity:.4;cursor:not-allowed}.refresh-icon{display:inline-block;margin-right:6px}.spinning{animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.wrap{padding:14px}.top{align-items:flex-start;gap:12px;flex-wrap:wrap}}
</style></head><body><div class="wrap"><div id="login" class="card login"><div class="logo">SpeakHub Publisher</div><p class="muted">Affiliate performance portal</p><div class="row"><input id="loginCode" placeholder="Số điện thoại hoặc publisher slug"><input id="password" type="password" placeholder="Password"></div><button class="primary" style="width:100%;margin-top:10px" onclick="loginPublisher()">Đăng nhập</button><div id="loginMsg"></div></div><main id="app" class="hidden"><div class="top"><div><div class="logo">SpeakHub Publisher</div><div id="pubName" class="muted"></div></div><button onclick="logout()">Đăng xuất</button></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end"><div><b>Affiliate link của bạn</b><div id="pubLink" class="link" style="margin-top:6px"></div></div><div class="tools"><label><span class="muted" style="font-size:12px;display:block;margin-bottom:4px">Filter theo tháng</span><select id="monthFilter" onchange="customerPage=1;loadReport()"></select></label><button id="refreshBtn" class="primary" onclick="customerPage=1;loadReport(true)"><span id="refreshIcon" class="refresh-icon">↻</span>Refresh report</button></div></div><div id="kpis" class="kpis"></div></div><div class="card" style="margin-top:14px"><h3>Khách hàng & funnel</h3><p class="muted">Last step cho biết bước xa nhất khách đã đi tới. Last-click attribution được chốt khi order được tạo.</p><div style="overflow:auto"><table><thead><tr><th>Khách hàng</th><th>SĐT</th><th>Số buổi</th><th>Step dừng</th><th>Payment</th><th>Doanh thu</th><th>Hoa hồng</th><th>Thời điểm attribution</th></tr></thead><tbody id="rows"></tbody></table></div><div id="customerPager" class="pager"></div></div></main></div><script>
let token=localStorage.getItem('speakhub_publisher_token')||'',customerPage=1,reportData=null;const PAGE_SIZE=10;function initMonthFilter(){const el=document.getElementById('monthFilter');if(!el||el.dataset.ready)return;const now=new Date(),opts=['<option value="">Toàn bộ</option>'];for(let i=0;i<18;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1),v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');opts.push('<option value="'+v+'">'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()+'</option>')}el.innerHTML=opts.join('');el.dataset.ready='1'};const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';async function req(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'REQUEST_FAILED');e.status=r.status;throw e}return d}async function loginPublisher(){loginMsg.innerHTML='';try{const d=await req('/api/admin?action=publisher-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:loginCode.value.trim(),password:password.value})});token=d.token;localStorage.setItem('speakhub_publisher_token',token);customerPage=1;await loadReport()}catch(e){loginMsg.innerHTML='<p style="color:#c33">'+e.message+'</p>'}}function logout(){localStorage.removeItem('speakhub_publisher_token');location.reload()}
function setRefreshing(on){const b=document.getElementById('refreshBtn'),i=document.getElementById('refreshIcon');if(b)b.disabled=on;if(i)i.classList.toggle('spinning',on)}
async function loadReport(showSpin=false){initMonthFilter();if(showSpin)setRefreshing(true);try{const month=document.getElementById('monthFilter')?.value||'';const d=await req('/api/admin?action=publisher-report'+(month?'&month='+encodeURIComponent(month):''));reportData=d;login.classList.add('hidden');app.classList.remove('hidden');pubName.textContent=d.publisher.name+' · '+(d.publisher.commission_scheme?.length?d.publisher.commission_scheme.map(r=>r.min_sessions+(r.max_sessions==null?'+':'–'+r.max_sessions)+' buổi: '+money(r.amount)).join(' · '):('Commission '+Number(d.publisher.commission_rate||0)+'%'));pubLink.textContent='https://speakhub.vn/'+d.publisher.slug;const s=d.summary;kpis.innerHTML=[['Clicks',s.clicks],['Unique visitors',s.unique_visitors],['Paid customers',s.paid_orders],['Conversion',Number(s.conversion_rate||0).toFixed(1)+'%'],['Revenue',money(s.revenue)],['Commission',money(s.commission)]].map(x=>'<div class="kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'<div style="grid-column:1/-1;color:#68766f;font-size:13px"><b>Funnel:</b> Landing '+(s.funnel?.landing||0)+' → Customer info '+(s.funnel?.customer_info||0)+' → Order '+(s.funnel?.order_created||0)+' → QR '+(s.funnel?.payment_qr||0)+' → Paid '+(s.funnel?.paid||0)+'</div>';renderCustomers()}catch(e){if(e.status===401&&token){localStorage.removeItem('speakhub_publisher_token');token='';login.classList.remove('hidden');app.classList.add('hidden')}loginMsg.innerHTML='<p style="color:#c33">'+e.message+'</p>'}finally{setRefreshing(false)}}
function renderCustomers(){const all=reportData?.customers||[],pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));customerPage=Math.min(Math.max(1,customerPage),pages);const start=(customerPage-1)*PAGE_SIZE,c=all.slice(start,start+PAGE_SIZE);rows.innerHTML=c.map(x=>'<tr><td>'+esc(x.full_name||'-')+'</td><td>'+esc(x.phone||'-')+'</td><td>'+Number(x.session_count||0)+'</td><td class="stage">'+esc(x.stage)+'</td><td>'+esc(x.payment_status||'-')+'</td><td>'+money(x.amount)+'</td><td>'+money(x.commission)+'</td><td>'+new Date(x.attributed_at).toLocaleString('vi-VN')+'</td></tr>').join('')||'<tr><td colspan="8">Chưa có khách hàng attributed.</td></tr>';renderPager(customerPager,customerPage,pages,p=>{customerPage=p;renderCustomers()})}
function renderPager(host,page,pages,onPage){if(!host)return;if(pages<=1){host.innerHTML='';return}let nums=[];for(let i=Math.max(1,page-2);i<=Math.min(pages,page+2);i++)nums.push(i);host.innerHTML='<button '+(page<=1?'disabled':'')+' data-p="'+(page-1)+'">‹</button>'+nums.map(i=>'<button class="'+(i===page?'on':'')+'" data-p="'+i+'">'+i+'</button>').join('')+'<button '+(page>=pages?'disabled':'')+' data-p="'+(page+1)+'">›</button>';host.querySelectorAll('button:not([disabled])').forEach(b=>b.onclick=()=>onPage(Number(b.dataset.p)))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}initMonthFilter();if(token)loadReport();
</script></body></html>
