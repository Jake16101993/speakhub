<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakHub Publisher</title><style>:root{--g:#0b7a5d;--gd:#075d48;--line:#d9e5e0;--muted:#68766f}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f3f7f5;color:#14201c}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:30px;font-weight:900;color:var(--gd)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 30px #083b2d0c}.login{max-width:520px;margin:10vh auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font-size:16px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.muted{color:var(--muted)}.hidden{display:none}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.kpi{background:#eef8f4;border:1px solid #d5eee4;border-radius:14px;padding:14px}.kpi b{display:block;font-size:24px;color:var(--gd);margin-top:4px}.link{font-family:ui-monospace,monospace;background:#eff7f4;border-radius:10px;padding:9px;word-break:break-all}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;font-size:13px}th{color:var(--muted)}.stage{font-weight:900;color:var(--gd)}@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div id="login" class="card login"><div class="logo">SpeakHub Publisher</div><p class="muted">Affiliate performance portal</p><div class="row"><input id="loginCode" placeholder="Login code or publisher slug"><input id="password" type="password" placeholder="Password"></div><button class="primary" style="width:100%;margin-top:10px" onclick="loginPublisher()">Đăng nhập</button><div id="loginMsg"></div></div><main id="app" class="hidden"><div class="top"><div><div class="logo">SpeakHub Publisher</div><div id="pubName" class="muted"></div></div><button onclick="logout()">Đăng xuất</button></div><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>Affiliate link của bạn</b><div id="pubLink" class="link" style="margin-top:6px"></div></div><button class="primary" onclick="loadReport()">Refresh report</button></div><div id="kpis" class="kpis"></div></div><div class="card" style="margin-top:14px"><h3>Khách hàng & funnel</h3><p class="muted">Last step cho biết bước xa nhất khách đã đi tới. Last-click attribution được chốt khi order được tạo.</p><div style="overflow:auto"><table><thead><tr><th>Khách hàng</th><th>SĐT</th><th>Step dừng</th><th>Payment</th><th>Doanh thu</th><th>Thời điểm attribution</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script>let token=localStorage.getItem('speakhub_publisher_token')||'';const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';async function req(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'REQUEST_FAILED');return d}async function loginPublisher(){loginMsg.innerHTML='';try{const d=await req('/api/admin?action=publisher-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:loginCode.value.trim(),password:password.value})});token=d.token;localStorage.setItem('speakhub_publisher_token',token);await loadReport()}catch(e){loginMsg.innerHTML='<p style="color:#c33">'+e.message+'</p>'}}function logout(){localStorage.removeItem('speakhub_publisher_token');location.reload()}async function loadReport(){try{const d=await req('/api/admin?action=publisher-report');login.classList.add('hidden');app.classList.remove('hidden');pubName.textContent=d.publisher.name+' · Commission '+Number(d.publisher.commission_rate||0)+'%';pubLink.textContent='https://speakhub.vn/'+d.publisher.slug;const s=d.summary;kpis.innerHTML=[['Clicks',s.clicks],['Unique visitors',s.unique_visitors],['Paid customers',s.paid_orders],['Conversion',Number(s.conversion_rate||0).toFixed(1)+'%'],['Revenue',money(s.revenue)],['Commission',money(s.commission)]].map(x=>'<div class="kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'<div style="grid-column:1/-1;color:#68766f;font-size:13px"><b>Funnel:</b> Landing '+(s.funnel?.landing||0)+' → Customer info '+(s.funnel?.customer_info||0)+' → Order '+(s.funnel?.order_created||0)+' → QR '+(s.funnel?.payment_qr||0)+' → Paid '+(s.funnel?.paid||0)+'</div>';rows.innerHTML=(d.customers||[]).map(x=>'<tr><td>'+esc(x.full_name||'-')+'</td><td>'+esc(x.phone||'-')+'</td><td class="stage">'+esc(x.stage)+'</td><td>'+esc(x.payment_status||'-')+'</td><td>'+money(x.amount)+'</td><td>'+new Date(x.attributed_at).toLocaleString('vi-VN')+'</td></tr>').join('')||'<tr><td colspan="6">Chưa có khách hàng attributed.</td></tr>'}catch(e){if(token){localStorage.removeItem('speakhub_publisher_token');token=''}login.classList.remove('hidden');app.classList.add('hidden');loginMsg.innerHTML='<p style="color:#c33">'+e.message+'</p>'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)loadReport();</script></body></html>
