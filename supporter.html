<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakHub Supporter</title><style>
:root{--g:#0b7a5b;--gd:#075c45;--line:#dce7e2;--muted:#68766f;--bg:#f4f8f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#17211d}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:24px;font-weight:900;color:var(--gd)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #173c2c0a}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.tabs button.on,.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:15px}.row{display:grid;grid-template-columns:1fr auto;gap:8px}.muted{color:var(--muted)}.hidden{display:none!important}.session{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.session b{display:block}.session small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;border:1px solid var(--line);border-radius:9px;padding:6px}.day.has{background:#eef9f5}.day span{display:block;font-size:10px;margin-top:4px}.chatbox{height:360px;overflow:auto;background:#f7faf8;border-radius:12px;padding:10px}.msg{max-width:80%;padding:8px 10px;border-radius:10px;background:#e9efec;margin:6px 0}.msg.USER{margin-left:auto;background:#dff4eb}.chatrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}@media(max-width:650px){.session{grid-template-columns:1fr}.row{grid-template-columns:1fr}.day{min-height:48px;font-size:10px}.day span{font-size:0}.day span:before{content:'•';font-size:14px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="logo">SpeakHub Supporter</div><div class="muted">Tài liệu · lịch học · hỗ trợ học viên</div></div><button id="logout" class="btn hidden" onclick="logout()">Đăng xuất</button></div>
<div id="login" class="card" style="max-width:520px;margin:60px auto"><h2>Supporter Login</h2><div class="row"><input id="pw" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Đăng nhập</button></div><div id="lm"></div></div>
<div id="app" class="hidden"><div class="tabs"><button class="on" onclick="tab('docs',this)">Tài liệu sắp tới</button><button onclick="tab('schedule',this)">Tra lịch học</button><button onclick="tab('chat',this)">Chat SpeakHub</button></div>
<section id="docs"><div class="card"><h2>Tài liệu cần in</h2><div class="muted">Chỉ hiển thị session từ hôm nay trở đi. Session đã qua tự động ẩn.</div><div id="sessions"></div></div></section>
<section id="schedule" class="hidden"><div class="card"><h2>Tra lịch học ứng viên</h2><div class="row"><input id="q" placeholder="Số điện thoại hoặc tên"><button class="btn primary" onclick="search()">Tra cứu</button></div><div id="results"></div></div><div id="cal"></div></section>
<section id="chat" class="hidden"><div class="card"><h2>Chat SpeakHub</h2><div id="msgs" class="chatbox"></div><div class="chatrow"><input id="chatText" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')send()"><button class="btn primary" onclick="send()">Gửi</button></div></div></section></div></div>
<script>
if(location.pathname==='/supporter.html')history.replaceState(null,'','/supporter'+location.search+location.hash);
let token=sessionStorage.getItem('supporter_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||d.details||'Request failed');return d}async function login(){try{const r=await fetch('/api/admin?action=supporter-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;sessionStorage.setItem('supporter_token',token);boot()}catch(e){lm.innerHTML='<p style="color:#b33">'+esc(e.message)+'</p>'}}function logout(){sessionStorage.removeItem('supporter_token');location.reload()}function boot(){document.getElementById('login').classList.add('hidden');app.classList.remove('hidden');logout.classList.remove('hidden');loadDocs();loadChat()}function tab(id,b){document.querySelectorAll('#app>section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='chat')loadChat()}
async function loadDocs(){try{const d=await api('/api/admin?action=supporter-sessions');sessions.innerHTML=d.sessions.map(x=>`<div class="session"><div><b>${esc(x.session_date)}</b><small>${esc((x.starts_at||'').slice(0,5))}–${esc((x.ends_at||'').slice(0,5))}</small></div><div><b>${esc(x.program_name)}</b><small>${esc(x.topic_title||'Chưa có topic')} · ${esc(x.teacher_name)} · ${esc(x.room_name)}</small></div><div>${x.download_url?`<a class="btn primary" href="${esc(x.download_url)}" target="_blank" download>Tải PDF</a>`:'<span class="muted">Chưa có PDF</span>'}</div></div>`).join('')||'<p class="muted">Không có session sắp tới.</p>'}catch(e){sessions.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function search(){try{const d=await api('/api/admin?action=supporter-student-schedule&q='+encodeURIComponent(q.value));results.innerHTML=(d.customers||[]).map(c=>`<button class="btn" onclick="calendar('${c.id}')">${esc(c.full_name)} · ${esc(c.phone)}</button>`).join('')||'<p class="muted">Không tìm thấy.</p>';if(d.customers?.length===1)calendar(d.customers[0].id)}catch(e){results.innerHTML=esc(e.message)}}async function calendar(id){const d=await api('/api/admin?action=supporter-student-schedule&customer_id='+encodeURIComponent(id)),rows=d.bookings||[],groups={};rows.forEach(x=>(groups[x.session_date.slice(0,7)]??=[]).push(x));cal.innerHTML=Object.entries(groups).sort().map(([m,a])=>{const[y,mo]=m.split('-').map(Number),off=(new Date(y,mo-1,1).getDay()+6)%7,n=new Date(y,mo,0).getDate(),map={};a.forEach(x=>(map[+x.session_date.slice(-2)]??=[]).push(x));let cells='<div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>'+('<div></div>'.repeat(off));for(let i=1;i<=n;i++)cells+=`<div class="day ${(map[i]||[]).length?'has':''}"><b>${i}</b>${(map[i]||[]).map(x=>`<span>${esc(x.starts_at.slice(0,5))} ${esc(x.program_name)}</span>`).join('')}</div>`;return `<div class="card"><h3>${m}</h3><div class="grid">${cells}</div></div>`}).join('')||'<div class="card muted">Chưa có lịch học.</div>'}
const vid=()=>{let v=localStorage.getItem('speakhub_supporter_chat');if(!v){v='supporter-'+(crypto.randomUUID?.()||Date.now());localStorage.setItem('speakhub_supporter_chat',v)}return v};async function loadChat(){try{const r=await fetch('/api/admin?action=chat&visitor_id='+encodeURIComponent(vid())),d=await r.json();msgs.innerHTML=(d.messages||[]).map(x=>`<div class="msg ${x.sender}">${esc(x.body)}</div>`).join('');msgs.scrollTop=msgs.scrollHeight}catch{}}async function send(){const text=chatText.value.trim();if(!text)return;chatText.value='';await fetch('/api/admin?action=chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({visitor_id:vid(),text})});loadChat()}if(token)boot();
</script></body></html>
