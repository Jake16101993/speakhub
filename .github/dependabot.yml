version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - type:infra
      - P2
    commit-message:
      prefix: "chore(deps)"
    groups:
      supabase:
        patterns: ["@supabase/*"]
      payments:
        patterns: ["@payos/*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - type:infra
      - P2
    commit-message:
      prefix: "chore(ci)"
